AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Relay authenticated Bedrock intake, persistent DynamoDB workspace and road planning
Parameters:
  FrontendOrigin:
    Type: String
    Description: Exact Amplify HTTPS origin, without trailing slash
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  BedrockModelId:
    Type: String
    Description: Converse-compatible model ID or inference profile ID allowed by the hackathon
    MinLength: 1
  BedrockResourceArns:
    Type: CommaDelimitedList
    Description: Allowed model ARNs (include inference profile ARN and destination model ARNs for cross-Region inference)
Resources:
  Users:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Users
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 1
      TokenValidityUnits:
        IdToken: hours
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      Auth:
        DefaultAuthorizer: Coordinator
        Authorizers:
          Coordinator:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${Users}'
              audience:
                - !Ref UserClient
  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 28
      MemorySize: 512
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Ref BedrockResourceArns
            - Effect: Allow
              Action:
                - geo-routes:CalculateRouteMatrix
                - geo-routes:CalculateRoutes
              Resource: !Sub 'arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default'
      Events:
        Extract:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ai/extract
            Method: POST
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ai/plan
            Method: POST
        CallTurn:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ai/call-turn
            Method: POST
        CallReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ai/call-report
            Method: POST
  Coordinators:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Coordinators
      UserPoolId: !Ref Users
  Viewers:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Viewers
      UserPoolId: !Ref Users
  ReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  TeamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  PlansTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  AlertsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ActivityTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  Uploads:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods:
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 120
  UploadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Uploads
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt Uploads.Arn
              - !Sub '${Uploads.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  WorkspaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist/
      Handler: workspace.handler
      Runtime: nodejs22.x
      Timeout: 28
      MemorySize: 1024
      ReservedConcurrentExecutions: 4
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          REPORTS_TABLE: !Ref ReportsTable
          TEAMS_TABLE: !Ref TeamsTable
          PLANS_TABLE: !Ref PlansTable
          ALERTS_TABLE: !Ref AlertsTable
          ACTIVITY_TABLE: !Ref ActivityTable
          UPLOAD_BUCKET: !Ref Uploads
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Ref BedrockResourceArns
            - Effect: Allow
              Action:
                - geo-routes:CalculateRouteMatrix
                - geo-routes:CalculateRoutes
              Resource: !Sub 'arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default'
            - Effect: Allow
              Action: geo-places:Geocode
              Resource: !Sub 'arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource:
                - !GetAtt ReportsTable.Arn
                - !GetAtt TeamsTable.Arn
                - !GetAtt PlansTable.Arn
                - !GetAtt AlertsTable.Arn
                - !GetAtt ActivityTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${Uploads.Arn}/incoming/*'
      Events:
        Workspace:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
  WorkspaceLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WorkspaceFunction}'
      RetentionInDays: 7
  AiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AiFunction}'
      RetentionInDays: 7
Outputs:
  WorkspaceApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  UploadBucket:
    Value: !Ref Uploads
  AiApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CognitoClientId:
    Value: !Ref UserClient
  CognitoUserPoolId:
    Value: !Ref Users
  AwsRegion:
    Value: !Ref AWS::Region
